# /etc/nginx/sites-available/nexgencode.in
# Static production build (dist/, prerendered per route) + reverse proxy to the .NET API on :5080.
# Tested syntax for nginx 1.18 (Ubuntu). Certificates come from certbot (Let's Encrypt).

# ---------- HTTP -> HTTPS (both hosts) ----------
server {
    listen 80;
    listen [::]:80;
    server_name nexgencode.in www.nexgencode.in;

    # Let certbot renewals through (works with both the nginx and webroot authenticators)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://nexgencode.in$request_uri;
    }
}

# ---------- https://www -> https://nexgencode.in ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexgencode.in;

    ssl_certificate     /etc/letsencrypt/live/nexgencode.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexgencode.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nexgencode.in$request_uri;
}

# ---------- Main site ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexgencode.in;

    ssl_certificate     /etc/letsencrypt/live/nexgencode.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexgencode.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Output of `npm run build` (copied here by deploy/deploy.sh)
    root /var/www/nexgencode.in/html;
    index index.html;
    charset utf-8;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               text/javascript application/ld+json image/svg+xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Canonical URLs have no trailing slash: /services/crm/ -> /services/crm
    rewrite ^/(.+)/$ /$1 permanent;

    # ---- Pages ----
    # 1. real files (/sitemap.xml, /robots.txt, /googleXXXX.html, /og-image.png ...)
    # 2. prerendered route folders (/services/school-erp -> /services/school-erp/index.html)
    # 3. otherwise the prerendered "Page not found" page with a real 404 status
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;   # HTML always revalidated so new deploys show at once
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Admin panel: client-rendered shell for every /admin/* URL, never indexed
    location /admin {
        try_files $uri /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Long cache for hashed build assets ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Other static files in public/ (favicon, og-image, logo)
    location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---- .NET API (contact form, reviews, team, admin) ----
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;   # image uploads are limited to 3 MB by the API
    }

    # Uploaded team / review photos (served by the API from wwwroot/uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
